services:
  dedalo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
        # Installs bubblewrap in the image (command isolation); 0 to omit it
        WITH_BWRAP: 1
    image: dedalo:latest
    container_name: dedalo
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # Security Hardening
    # --------------------------------------------------------------------------
    # Blocks privilege escalation of subprocesses (suid/guid)
    security_opt:
      - no-new-privileges:true
    # Drops all unnecessary Linux capabilities
    cap_drop:
      - ALL
    # Explicitly runs with an unprivileged UID/GID
    user: "1000:1000"
    # Read-only root filesystem: writes only go to data/ and /tmp
    read_only: true
    # Command isolation with bubblewrap (DEDALO_SANDBOX=auto|on). It needs user namespaces, which
    # Docker's default profile blocks; uncomment these three lines only if you enable it:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    #   - systempaths=unconfined
    # (under `security_opt`, next to no-new-privileges). Without them, `auto` runs without isolation and `on` fails.

    ports:
      - "8080:8080"

    environment:
      - DEDALO_PORT=8080
      - DEDALO_HOST=0.0.0.0
      # Domains used to access Dédalo (Host header); by default only localhost
      - DEDALO_ALLOWED_HOSTS=${DEDALO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      # Set to 1 for headless mode (disables the web UI, keeps Webhooks and API)
      - DEDALO_HEADLESS=0
      # Command isolation: off | auto | on (empty = default: off in nodes, auto in transform.coder)
      - DEDALO_SANDBOX=${DEDALO_SANDBOX:-}
      # Memory optimizations for Python and glibc
      - PYTHONOPTIMIZE=1
      - MALLOC_TRIM_THRESHOLD_=65536

    volumes:
      # Persistence of flows, SQLite history, secrets and state
      - ./data:/app/data
      # Isolated temporary space in RAM for ephemeral scripts
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 32M
          mode: 1777

      # ------------------------------------------------------------------------
      # NOTE on CPU, temperature and disk metrics:
      # When running inside an isolated Docker container, the system
      # monitoring nodes (input.pi_health) read the container's environment.
      # If you want to monitor the real host (Raspberry Pi/Linux), you can uncomment:
      # - /sys/class/thermal:/sys/class/thermal:ro
      # - /proc/stat:/proc/stat:ro
      # ------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Resource control (Aligned with Dédalo's low-footprint design)
    # --------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"
        reservations:
          memory: 32M

    # --------------------------------------------------------------------------
    # Log rotation to protect the SD card / disk
    # --------------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
