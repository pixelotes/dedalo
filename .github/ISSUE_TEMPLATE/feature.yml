name: Propuesta
description: Sugiere una mejora o un nodo nuevo
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema o necesidad
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
