name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities **do not use this form**; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, attach the flow (without secrets).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [run.sh, Docker, systemd, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
